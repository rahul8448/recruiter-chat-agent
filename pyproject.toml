[project]
name = "recruiter-chat-agent"
version = "0.1.0"
description = "An agentic chat assistant that talks to recruiters about my skills, experience, and projects."
readme = "README.md"
authors = [
    { name = "Rahul Sharma", email = "rahul8448@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.125.0",
    "cryptography>=50.0.0",
    "gradio>=6.25.0",
    "python-dotenv>=1.2.1",
    "pyyaml>=6.0.3",
]

[project.scripts]
recruiter-chat = "recruiter_chat_agent.agent:main"
recruiter-chat-web = "recruiter_chat_agent.web:main"
recruiter-chat-inquiries = "recruiter_chat_agent.inquiries:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
